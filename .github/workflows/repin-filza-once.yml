name: Prepare merged FilzaSlop workflow blob

on:
  push:
    branches:
      - iphone16-ios27-v2
    paths:
      - .github/workflows/repin-filza-once.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: iphone16-ios27-v2
          fetch-depth: 0

      - name: Create unattached Git blob for repinned main workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          sed -i 's/FILZA_FORK_COMMIT: 4740b2c46dbca1fdd2f2a317c5342a586cc4c2b4/FILZA_FORK_COMMIT: e003412e404aa48e39011317f60cade8bb2b3620/' .github/workflows/main.yml
          sed -i 's/FilzaSlop-full-ByeTunes-badquery-iOS27-4740b2c\.ipa/FilzaSlop-full-ByeTunes-badquery-iOS27-e003412.ipa/' .github/workflows/main.yml
          grep -Fq 'FILZA_FORK_COMMIT: e003412e404aa48e39011317f60cade8bb2b3620' .github/workflows/main.yml
          grep -Fq 'FILZA_FORK_IPA: FilzaSlop-full-ByeTunes-badquery-iOS27-e003412.ipa' .github/workflows/main.yml
          python3 - <<'PY' > /tmp/blob.json
          import base64, json
          raw = open('.github/workflows/main.yml','rb').read()
          print(json.dumps({'content': base64.b64encode(raw).decode(), 'encoding': 'base64'}))
          PY
          RESPONSE="$(curl -fsSL -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @/tmp/blob.json \
            'https://api.github.com/repos/NightVibes33/Dopamine/git/blobs')"
          BLOB_SHA="$(python3 -c 'import json,sys; print(json.loads(sys.stdin.read())["sha"])' <<<"$RESPONSE")"
          test -n "$BLOB_SHA"
          echo "PREPARED_MAIN_WORKFLOW_BLOB_SHA=$BLOB_SHA"
          git diff -- .github/workflows/main.yml
