name: iOS27 A18 AVE kernel research

on:
  workflow_dispatch:
  push:
    branches:
      - iphone16-ios27-v2
    paths:
      - '.github/workflows/ios27-ave-research.yml'
      - 'Research/tools/ave_validation_map.py'

permissions:
  contents: read

jobs:
  ave-diff:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      B3_URL: https://updates.cdn-apple.com/2026SpringSeed/fullrestores/140-35950/D135F5B5-C2BE-4630-8AE9-C78A6F0E8381/iPhone17%2C3_27.0_24A5380h_Restore.ipsw
      B4_URL: https://updates.cdn-apple.com/2026SpringSeed/fullrestores/140-57108/5E816D0E-89BB-4B95-8825-6A3EDF22E509/iPhone17%2C3_27.0_24A5390f_Restore.ipsw
      B5_URL: https://updates.cdn-apple.com/2026SpringSeed/fullrestores/140-86338/57B34BF9-3BF5-4B47-BCCA-81B282175957/iPhone17%2C3_27.0_24A5408d_Restore.ipsw

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ipsw research toolkit
        shell: bash
        run: |
          set -euxo pipefail
          brew tap blacktop/tap
          brew trust blacktop/tap
          brew install blacktop/tap/ipsw
          ipsw version

      - name: Remote-extract iPhone 16 kernelcaches
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p firmware/b3 firmware/b4 firmware/b5 report
          ipsw --no-color extract --remote "$B3_URL" --kernel -o firmware/b3
          ipsw --no-color extract --remote "$B4_URL" --kernel -o firmware/b4
          ipsw --no-color extract --remote "$B5_URL" --kernel -o firmware/b5
          find firmware -maxdepth 4 -type f -print | sort | tee report/extracted-files.txt

      - name: Inventory kernels and AVE-related fileset entries
        shell: bash
        run: |
          set -euxo pipefail
          B3_KERNEL="$(find firmware/b3 -type f -name 'kernelcache.release.*' -print -quit)"
          B4_KERNEL="$(find firmware/b4 -type f -name 'kernelcache.release.*' -print -quit)"
          B5_KERNEL="$(find firmware/b5 -type f -name 'kernelcache.release.*' -print -quit)"
          test -s "$B3_KERNEL"
          test -s "$B4_KERNEL"
          test -s "$B5_KERNEL"
          printf 'B3_KERNEL=%s\nB4_KERNEL=%s\nB5_KERNEL=%s\n' "$B3_KERNEL" "$B4_KERNEL" "$B5_KERNEL" >> "$GITHUB_ENV"

          for label in b3 b4 b5; do
            case "$label" in
              b3) kernel="$B3_KERNEL" ;;
              b4) kernel="$B4_KERNEL" ;;
              b5) kernel="$B5_KERNEL" ;;
            esac
            ipsw --no-color kernel version "$kernel" | tee "report/${label}-kernel-version.txt"
            ipsw --no-color kernel kexts "$kernel" | tee "report/${label}-kexts.txt"
            grep -Ei 'AVE|VideoEncoder|VXE|AppleVXE' "report/${label}-kexts.txt" > "report/${label}-ave-matches.txt" || true
          done

          cat report/*-ave-matches.txt | \
            awk '{for(i=1;i<=NF;i++) if($i ~ /^com\.apple\./) print $i}' | \
            sed 's/[(),]//g' | sort -u > report/ave-candidates.txt

          echo '=== AVE candidates ==='
          cat report/ave-candidates.txt || true

          ipsw --no-color kernel kexts --diff "$B3_KERNEL" "$B4_KERNEL" > report/b3-b4-kext-diff.txt || true
          ipsw --no-color kernel kexts --diff "$B4_KERNEL" "$B5_KERNEL" > report/b4-b5-kext-diff.txt || true

      - name: Extract and fingerprint AVE candidates
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p report/kexts/b3 report/kexts/b4 report/kexts/b5 report/info report/strings
          : > report/fingerprints.txt

          while IFS= read -r kext; do
            [[ -n "$kext" ]] || continue
            echo "### $kext" | tee -a report/fingerprints.txt
            for label in b3 b4 b5; do
              case "$label" in
                b3) kernel="$B3_KERNEL" ;;
                b4) kernel="$B4_KERNEL" ;;
                b5) kernel="$B5_KERNEL" ;;
              esac
              outdir="report/kexts/$label"
              ipsw --no-color kernel extract "$kernel" "$kext" --force -o "$outdir" || true
              file="$outdir/$kext"
              if [[ -s "$file" ]]; then
                printf '%s  %s  ' "$label" "$kext" | tee -a report/fingerprints.txt
                shasum -a 256 "$file" | tee -a report/fingerprints.txt
                stat -f 'size=%z' "$file" | tee -a report/fingerprints.txt
                ipsw --no-color macho info "$file" > "report/info/${label}-${kext}.txt" || true
                strings -a "$file" | sort -u > "report/strings/${label}-${kext}.txt" || true
              else
                echo "$label  $kext  MISSING" | tee -a report/fingerprints.txt
              fi
            done

            if [[ -s "report/kexts/b3/$kext" && -s "report/kexts/b4/$kext" ]]; then
              diff_count="$( (cmp -l "report/kexts/b3/$kext" "report/kexts/b4/$kext" 2>/dev/null || true) | wc -l | tr -d ' ' )"
              echo "$kext b3->b4 differing-byte-positions=$diff_count" | tee -a report/fingerprints.txt
              comm -3 "report/strings/b3-${kext}.txt" "report/strings/b4-${kext}.txt" > "report/strings/${kext}-b3-b4.diff" || true
            fi
            if [[ -s "report/kexts/b4/$kext" && -s "report/kexts/b5/$kext" ]]; then
              diff_count="$( (cmp -l "report/kexts/b4/$kext" "report/kexts/b5/$kext" 2>/dev/null || true) | wc -l | tr -d ' ' )"
              echo "$kext b4->b5 differing-byte-positions=$diff_count" | tee -a report/fingerprints.txt
              comm -3 "report/strings/b4-${kext}.txt" "report/strings/b5-${kext}.txt" > "report/strings/${kext}-b4-b5.diff" || true
            fi
          done < report/ave-candidates.txt

      - name: Map beta4 AppleAVE2 validation guards
        shell: bash
        run: |
          set -euxo pipefail
          python3 Research/tools/ave_validation_map.py \
            report/kexts/b4/com.apple.driver.AppleAVE2 \
            report/strings/com.apple.driver.AppleAVE2-b3-b4.diff \
            report/appleave2-validation-map.md

      - name: Build research summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# iPhone 16 iOS 27 AVE research'
            echo
            echo 'Target vulnerable candidate: CVE-2026-64747 (AVEVideoEncoder).'
            echo 'This workflow only performs firmware/KEXT comparison; it does not claim exploitability.'
            echo
            echo '## Firmware points'
            echo '- 24A5380h — iOS 27 beta 3 — 2026-07-06'
            echo '- 24A5390f — iOS 27 beta 4 — 2026-07-20'
            echo '- 24A5408d — iOS 27 beta 5 — 2026-08-10'
            echo
            echo '## Candidate fileset entries'
            sed 's/^/- `/' report/ave-candidates.txt | sed 's/$/`/' || true
            echo
            echo '## Fingerprints'
            echo '```'
            cat report/fingerprints.txt || true
            echo '```'
            echo
            echo '## Beta4 validation-function map'
            cat report/appleave2-validation-map.md || true
          } > report/summary.md
          cat report/summary.md

      - name: Upload AVE research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios27-a18-ave-research
          path: report
          retention-days: 14
