name: "Dopamine: build and upload"

on:
  push:
    branches:
      - '*'
    paths-ignore:
      - ".gitignore"
      - "Research/iOS27Beta3/**"
      - ".github/workflows/ios27-beta3-firmware-validation.yml"
  pull_request:
    branches:
      - '*'
    paths-ignore:
      - ".gitignore"
      - "Research/iOS27Beta3/**"
      - ".github/workflows/ios27-beta3-firmware-validation.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26-intel
    env:
      FILZA_UPSTREAM_NAME: FilzaSlop-v1.0.1-unsigned.ipa
      FILZA_UPSTREAM_SHA256: 36a13f2b6d77a86cc32d7744555a176a2092e933d3746e999110f1717d36a6ba
      FILZA_FORK_REPO: NightVibes33/FilzaSlop
      FILZA_FORK_COMMIT: 4740b2c46dbca1fdd2f2a317c5342a586cc4c2b4
      FILZA_FORK_IPA: FilzaSlop-full-ByeTunes-badquery-iOS27-4740b2c.ipa
      BAD_QUERY_COMMIT: 73ef6da1adabef0982fd00e36cb85f21b8f8194a
      IDEVICE_COMMIT: 37ee77cf713f483551f3cf33ea8b2087a40058ca

    steps:
      - name: Xcode 26.2 / iOS 26.2 Setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Verify Intel macOS 26 and iOS 26.2 SDK
        run: |
          set -euxo pipefail
          sw_vers
          test "$(uname -m)" = "x86_64"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          IOS_SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          test "$IOS_SDK_VERSION" = "26.2"
          test -d "$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun simctl list runtimes
          xcrun simctl list runtimes | grep -q 'iOS 26.2'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore THEOS cache
        id: dopamine-theos-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: dopamine-theos-${{ runner.os }}-${{ runner.arch }}-xcode26.2-sdk16.5-v1

      - name: Restore Procursus bootstrap cache
        uses: actions/cache@v4
        with:
          path: |
            Application/Dopamine/Resources/bootstrap_1800.tar.zst
            Application/Dopamine/Resources/bootstrap_1900.tar.zst
          key: dopamine-bootstraps-${{ runner.os }}-${{ hashFiles('Application/Dopamine/Resources/download_bootstraps.sh') }}

      - name: Restore verified upstream FilzaSlop cache
        uses: actions/cache@v4
        with:
          path: ${{ env.FILZA_UPSTREAM_NAME }}
          key: filzaslop-upstream-v1.0.1-${{ env.FILZA_UPSTREAM_SHA256 }}

      - name: Restore Cargo download cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: dopamine-filza-cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.IDEVICE_COMMIT }}-v1
          restore-keys: |
            dopamine-filza-cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore embedded idevice FFI cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/filza-idevice
          key: dopamine-filza-idevice-${{ runner.os }}-${{ runner.arch }}-xcode26.2-ios26.2-${{ env.IDEVICE_COMMIT }}-embedded-logger-v1

      - name: Install Procursus
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make

      - name: Install better GNU Make
        run: |
          brew install make
          echo "PATH=$(brew --prefix make)/libexec/gnubin:$PATH" >> "$GITHUB_ENV"

      - name: Install THEOS
        if: steps.dopamine-theos-cache.outputs.cache-hit != 'true'
        run: |
          set -x
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          mkdir -p "$THEOS"
          curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos >> install-theos.sh
          gsed -E "/^\\s*get_theos\\s*$/,+1 s/^(\\s*)(get_sdks)\\s*$/\\1mkdir -p \${THEOS}\\/sdks\\n\\1touch \${THEOS}\\/sdks\\/sdk\\n\\1\\2/g" -i install-theos.sh
          bash install-theos.sh
          curl -L https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz --output "$THEOS/sdks/iPhoneOS16.5.sdk.tar.xz"
          gunzip "$THEOS/sdks/iPhoneOS16.5.sdk.tar.xz"
          tar -xf "$THEOS/sdks/iPhoneOS16.5.sdk.tar" -C "$THEOS/sdks"
          rm "$THEOS/sdks/iPhoneOS16.5.sdk.tar"
          cd "$BASEDIR"

      - name: Verify THEOS cache/install
        run: |
          set -euxo pipefail
          test -f "$GITHUB_WORKSPACE/theos/makefiles/common.mk"
          test -d "$GITHUB_WORKSPACE/theos/sdks/iPhoneOS16.5.sdk"

      - name: Build and Install trustcache
        run: |
          set -euxo pipefail
          git clone https://github.com/CRKatri/trustcache
          cd trustcache
          export CFLAGS="${CFLAGS:-} -I$(brew --prefix openssl)/include"
          export LDFLAGS="${LDFLAGS:-} -L$(brew --prefix openssl)/lib"
          gmake -j$(sysctl -n hw.logicalcpu) OPENSSL=1
          file trustcache
          test "$(uname -m)" = "x86_64"
          sudo cp trustcache /opt/procursus/bin/

      - name: Set Environment Variables
        run: |
          set -x
          T2=$(TZ=UTC-2 date +'%Y%m%d_%H%M%S')
          TS=$(date -j -f "%Y%m%d_%H%M%S" "${T2}" +%s)
          SHASH=$(git rev-parse --short HEAD)
          echo "ctime=${T2}" >> "$GITHUB_ENV"
          echo "ctimestamp=${TS}" >> "$GITHUB_ENV"
          echo "shorthash=${SHASH}" >> "$GITHUB_ENV"

      - name: Install libarchive
        run: brew install libarchive

      - name: Download Bootstraps
        run: |
          set -euxo pipefail
          cd Application/Dopamine/Resources
          if [ ! -s bootstrap_1800.tar.zst ] || [ ! -s bootstrap_1900.tar.zst ]; then
            ./download_bootstraps.sh
          fi
          test -s bootstrap_1800.tar.zst
          test -s bootstrap_1900.tar.zst

      - name: Fetch verified upstream FilzaSlop base
        run: |
          set -euxo pipefail
          if [ ! -s "${FILZA_UPSTREAM_NAME}" ]; then
            curl -fL --retry 3 \
              "https://github.com/0xjohnnydev/FilzaSlop/releases/download/v1.0.1/${FILZA_UPSTREAM_NAME}" \
              -o "${FILZA_UPSTREAM_NAME}"
          fi
          echo "${FILZA_UPSTREAM_SHA256}  ${FILZA_UPSTREAM_NAME}" | shasum -a 256 -c -

          rm -rf /tmp/filzaslop-upstream-check
          mkdir -p /tmp/filzaslop-upstream-check
          unzip -q "${FILZA_UPSTREAM_NAME}" -d /tmp/filzaslop-upstream-check
          FILZA_APP="$(find /tmp/filzaslop-upstream-check/Payload -maxdepth 1 -type d -name '*.app' | head -1)"
          test -n "$FILZA_APP"
          FILZA_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$FILZA_APP/Info.plist")"
          test "$FILZA_ID" = "com.apple.mobile.MobileHouseArrest"
          FILZA_EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$FILZA_APP/Info.plist")"
          FILZA_BIN="$FILZA_APP/$FILZA_EXECUTABLE"
          test -f "$FILZA_BIN"
          file "$FILZA_BIN"
          FILZA_ARCHS="$(lipo -archs "$FILZA_BIN")"
          echo "$FILZA_ARCHS" | tr ' ' '\n' | grep -Eq '^arm64(e)?$'

      - name: Build in-place ByeTunes + Filza dylib and replace upstream payload
        run: |
          set -euxo pipefail
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          export DEVELOPER_DIR="/Applications/Xcode_26.2.app/Contents/Developer"

          rm -rf /tmp/filzaslop-src /tmp/filzaslop-patched /tmp/filzaslop-final-check
          git clone "https://github.com/${FILZA_FORK_REPO}.git" /tmp/filzaslop-src
          cd /tmp/filzaslop-src
          git checkout --detach "$FILZA_FORK_COMMIT"
          test "$(git rev-parse HEAD)" = "$FILZA_FORK_COMMIT"
          git submodule update --init --recursive
          test "$(git -C ByeTunes rev-parse HEAD)" = "1a90f9e0f2b1a1787b208809ad2373f5c52175c8"
          test "$(git -C ThirdParty/bad_query rev-parse HEAD)" = "$BAD_QUERY_COMMIT"
          test -f ThirdParty/bad_query/bad_query/bad_query.c
          test -f ThirdParty/bad_query/bad_query/bad_query.h

          IDEVICE_CACHE="$GITHUB_WORKSPACE/.cache/filza-idevice"
          if test -s "$IDEVICE_CACHE/lib/libidevice_ffi.a" && \
             test -s "$IDEVICE_CACHE/include/idevice.h" && \
             test "$(cat "$IDEVICE_CACHE/COMMIT")" = "$IDEVICE_COMMIT"; then
            echo "Using cached idevice FFI"
            rm -rf Vendor/idevice
            mkdir -p Vendor/idevice
            cp -a "$IDEVICE_CACHE/." Vendor/idevice/
          else
            bash scripts/build-idevice.sh "$PWD/Vendor/idevice"
            rm -rf "$IDEVICE_CACHE"
            mkdir -p "$IDEVICE_CACHE"
            cp -a Vendor/idevice/. "$IDEVICE_CACHE/"
          fi
          test "$(cat Vendor/idevice/COMMIT)" = "$IDEVICE_COMMIT"
          test -s Vendor/idevice/lib/libidevice_ffi.a
          test -s Vendor/idevice/include/idevice.h

          gmake clean || true
          gmake -j"$(sysctl -n hw.logicalcpu)" all FINALPACKAGE=1 TARGET=iphone:clang:latest:16.0

          BUILT_DYLIB=".theos/obj/FilzaApplySandboxExt.dylib"
          test -f "$BUILT_DYLIB"
          file "$BUILT_DYLIB"
          BUILT_ARCHS="$(lipo -archs "$BUILT_DYLIB")"
          echo "Fork dylib architectures: $BUILT_ARCHS"
          test "$BUILT_ARCHS" = "arm64"
          grep -aFq 'ByeTunesEmbeddedHostFactory' "$BUILT_DYLIB"
          grep -aFq '[ByeTunesPort]' "$BUILT_DYLIB"
          grep -aFq 'TGMusicLibraryViewController' "$BUILT_DYLIB"
          grep -aFq 'DownloadView' "$BUILT_DYLIB"
          grep -aFq 'RingtonesView' "$BUILT_DYLIB"
          grep -aFq 'SettingsView' "$BUILT_DYLIB"
          grep -aFq 'com.apple.lsd' "$BUILT_DYLIB"
          grep -aFq 'LaunchServices fallback' "$BUILT_DYLIB"
          grep -aFq 'LaunchServices app discovery' "$BUILT_DYLIB"
          grep -aFq 'FILZA_MCM_DISABLE_LS_DISCOVERY' "$BUILT_DYLIB"
          grep -aFq 'blocked recursive Music Library embedding' "$BUILT_DYLIB"
          grep -aFq 'class-local Music Library viewDidLoad override' "$BUILT_DYLIB"
          grep -aFq 'intercepted TGMusicLibraryViewController before view loading' "$BUILT_DYLIB"
          grep -aFq 'routing Filza Music Library directly to' "$BUILT_DYLIB"
          grep -aFq '[AppsManagerFix][bad_query]' "$BUILT_DYLIB"
          grep -aFq 'sandbox_extension_consume' "$BUILT_DYLIB"

          bash scripts/stage-byetunes-resources.sh .theos/byetunes-resources
          test -s .theos/byetunes-resources/meriyah.umd.js
          test -s .theos/byetunes-resources/astring.umd.js
          test -s .theos/byetunes-resources/yt_ejs_helper.js
          test -s .theos/byetunes-resources/AppIconImage.png
          plutil -lint .theos/byetunes-resources/ByeTunes-Info.plist

          BUILT_HASH="$(shasum -a 256 "$BUILT_DYLIB" | awk '{print $1}')"
          echo "Fork dylib SHA-256: $BUILT_HASH"

          mkdir -p /tmp/filzaslop-patched
          unzip -q "$GITHUB_WORKSPACE/$FILZA_UPSTREAM_NAME" -d /tmp/filzaslop-patched
          FILZA_APP="$(find /tmp/filzaslop-patched/Payload -maxdepth 1 -type d -name '*.app' | head -1)"
          test -n "$FILZA_APP"
          FILZA_EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$FILZA_APP/Info.plist")"
          FILZA_BIN="$FILZA_APP/$FILZA_EXECUTABLE"
          test -f "$FILZA_BIN"

          DYLIB_PATHS="$(find "$FILZA_APP" -type f -name 'FilzaApplySandboxExt.dylib' -print)"
          DYLIB_COUNT="$(printf '%s\n' "$DYLIB_PATHS" | sed '/^$/d' | wc -l | tr -d ' ')"
          test "$DYLIB_COUNT" = "1"
          FILZA_DYLIB="$DYLIB_PATHS"

          otool -L "$FILZA_BIN" | grep -Fq 'FilzaApplySandboxExt.dylib'
          cp -f "$BUILT_DYLIB" "$FILZA_DYLIB"
          PATCHED_HASH="$(shasum -a 256 "$FILZA_DYLIB" | awk '{print $1}')"
          test "$PATCHED_HASH" = "$BUILT_HASH"

          cp -f .theos/byetunes-resources/meriyah.umd.js "$FILZA_APP/meriyah.umd.js"
          cp -f .theos/byetunes-resources/astring.umd.js "$FILZA_APP/astring.umd.js"
          cp -f .theos/byetunes-resources/yt_ejs_helper.js "$FILZA_APP/yt_ejs_helper.js"
          cp -f .theos/byetunes-resources/AppIconImage.png "$FILZA_APP/AppIconImage.png"

          python3 - "$FILZA_APP/Info.plist" .theos/byetunes-resources/ByeTunes-Info.plist <<'PY'
          import plistlib, sys
          filza_path, byetunes_path = sys.argv[1], sys.argv[2]
          with open(filza_path, 'rb') as f:
              filza = plistlib.load(f)
          with open(byetunes_path, 'rb') as f:
              byetunes = plistlib.load(f)
          for key in ('CFBundleDocumentTypes', 'UIFileSharingEnabled'):
              if key in byetunes:
                  filza[key] = byetunes[key]
          with open(filza_path, 'wb') as f:
              plistlib.dump(filza, f, fmt=plistlib.FMT_BINARY)
          PY
          plutil -lint "$FILZA_APP/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$FILZA_APP/Info.plist")" = "com.apple.mobile.MobileHouseArrest"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UIFileSharingEnabled' "$FILZA_APP/Info.plist")" = "true"

          cd /tmp/filzaslop-patched
          zip -qry "$GITHUB_WORKSPACE/$FILZA_FORK_IPA" Payload

          mkdir -p /tmp/filzaslop-final-check
          unzip -q "$GITHUB_WORKSPACE/$FILZA_FORK_IPA" -d /tmp/filzaslop-final-check
          FINAL_APP="$(find /tmp/filzaslop-final-check/Payload -maxdepth 1 -type d -name '*.app' | head -1)"
          test -n "$FINAL_APP"
          FINAL_DYLIBS="$(find "$FINAL_APP" -type f -name 'FilzaApplySandboxExt.dylib' -print)"
          FINAL_COUNT="$(printf '%s\n' "$FINAL_DYLIBS" | sed '/^$/d' | wc -l | tr -d ' ')"
          test "$FINAL_COUNT" = "1"
          FINAL_HASH="$(shasum -a 256 "$FINAL_DYLIBS" | awk '{print $1}')"
          test "$FINAL_HASH" = "$BUILT_HASH"
          grep -aFq '[ByeTunesPort]' "$FINAL_DYLIBS"
          grep -aFq 'TGMusicLibraryViewController' "$FINAL_DYLIBS"
          grep -aFq 'DownloadView' "$FINAL_DYLIBS"
          grep -aFq 'RingtonesView' "$FINAL_DYLIBS"
          grep -aFq 'SettingsView' "$FINAL_DYLIBS"
          grep -aFq 'com.apple.lsd' "$FINAL_DYLIBS"
          grep -aFq 'LaunchServices fallback' "$FINAL_DYLIBS"
          grep -aFq 'LaunchServices app discovery' "$FINAL_DYLIBS"
          grep -aFq 'FILZA_MCM_DISABLE_LS_DISCOVERY' "$FINAL_DYLIBS"
          grep -aFq 'blocked recursive Music Library embedding' "$FINAL_DYLIBS"
          grep -aFq 'class-local Music Library viewDidLoad override' "$FINAL_DYLIBS"
          grep -aFq 'intercepted TGMusicLibraryViewController before view loading' "$FINAL_DYLIBS"
          grep -aFq 'routing Filza Music Library directly to' "$FINAL_DYLIBS"
          grep -aFq '[AppsManagerFix][bad_query]' "$FINAL_DYLIBS"
          grep -aFq 'sandbox_extension_consume' "$FINAL_DYLIBS"
          test -s "$FINAL_APP/meriyah.umd.js"
          test -s "$FINAL_APP/astring.umd.js"
          test -s "$FINAL_APP/yt_ejs_helper.js"
          test -s "$FINAL_APP/AppIconImage.png"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$FINAL_APP/Info.plist")" = "com.apple.mobile.MobileHouseArrest"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UIFileSharingEnabled' "$FINAL_APP/Info.plist")" = "true"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes' "$FINAL_APP/Info.plist"
          echo "Verified ByeTunes direct-route crash fix, iOS 26/27 discovery, pinned bad_query fallback, resources, and dylib SHA-256: $FINAL_HASH"
          shasum -a 256 "$GITHUB_WORKSPACE/$FILZA_FORK_IPA"

      - name: Build real-device IPA
        run: |
          set -euxo pipefail
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          export DEVELOPER_DIR="/Applications/Xcode_26.2.app/Contents/Developer"
          gmake -j$(sysctl -n hw.logicalcpu) NIGHTLY=1

      - name: Bundle forked FilzaSlop IPA inside Dopamine IPA
        run: |
          set -euxo pipefail
          test -f Application/Dopamine.ipa
          test -f "$FILZA_FORK_IPA"

          rm -rf /tmp/dopamine-embed
          mkdir -p /tmp/dopamine-embed
          unzip -q Application/Dopamine.ipa -d /tmp/dopamine-embed
          APP="/tmp/dopamine-embed/Payload/Dopamine.app"
          test -d "$APP"
          cp -f "$FILZA_FORK_IPA" "$APP/FilzaSlop.ipa"
          test -f "$APP/FilzaSlop.ipa"

          ldid -SApplication/Dopamine/Dopamine.entitlements "$APP/Dopamine"
          ldid -s "$APP"

          rm -f Application/Dopamine.ipa
          cd /tmp/dopamine-embed
          zip -qry "$GITHUB_WORKSPACE/Application/Dopamine.ipa" Payload

      - name: Verify arm64 iPhoneOS IPA, embedded Filza, and no Apple signing identity
        run: |
          set -euxo pipefail
          test -f Application/Dopamine.ipa
          rm -rf /tmp/dopamine-ipa-check
          mkdir -p /tmp/dopamine-ipa-check
          unzip -q Application/Dopamine.ipa -d /tmp/dopamine-ipa-check
          APP="/tmp/dopamine-ipa-check/Payload/Dopamine.app"
          BIN="$APP/Dopamine"
          test -d "$APP"
          test -f "$BIN"
          test -f "$APP/FilzaSlop.ipa"
          cmp -s "$FILZA_FORK_IPA" "$APP/FilzaSlop.ipa"
          file "$BIN"
          ARCHS="$(lipo -archs "$BIN")"
          echo "Device binary architectures: $ARCHS"
          echo "$ARCHS" | tr ' ' '\n' | grep -qx arm64
          if echo "$ARCHS" | tr ' ' '\n' | grep -Eq '^(x86_64|i386)$'; then
            echo "Simulator architecture found in device IPA" >&2
            exit 1
          fi
          xcrun vtool -show-build "$BIN" || true
          SIGN_INFO="$(codesign -dv --verbose=4 "$BIN" 2>&1 || true)"
          echo "$SIGN_INFO"
          if echo "$SIGN_INFO" | grep -q '^Authority='; then
            echo "Unexpected Apple/developer signing authority found" >&2
            exit 1
          fi
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          shasum -a 256 "$APP/FilzaSlop.ipa"
          shasum -a 256 Application/Dopamine.ipa
          du -h Application/Dopamine.ipa

      - name: Assemble Dopamine + FilzaSlop research kit
        run: |
          set -euxo pipefail
          rm -rf ResearchKit
          mkdir -p ResearchKit
          cp Application/Dopamine.ipa ResearchKit/Dopamine.ipa
          cp "$FILZA_FORK_IPA" ResearchKit/FilzaSlop-fork.ipa
          DOPAMINE_SHA="$(shasum -a 256 Application/Dopamine.ipa | awk '{print $1}')"
          FILZA_FINAL_SHA="$(shasum -a 256 "$FILZA_FORK_IPA" | awk '{print $1}')"
          cat > ResearchKit/MANIFEST.txt <<EOF
          Dopamine iPhone 16 / iOS 27 research kit

          Dopamine:
          - real-device arm64 iPhoneOS IPA
          - Apple code signing disabled; ldid/ad-hoc packaged by the project
          - bundled companion path: Payload/Dopamine.app/FilzaSlop.ipa
          - SHA-256: ${DOPAMINE_SHA}

          FilzaSlop companion:
          - upstream base release: v1.0.1
          - upstream base SHA-256: ${FILZA_UPSTREAM_SHA256}
          - replacement dylib source: https://github.com/${FILZA_FORK_REPO}
          - replacement dylib source commit: ${FILZA_FORK_COMMIT}
          - iOS 26 third-party app discovery updated from upstream 583fc091 / v1.0.1
          - iOS 27-tolerant LaunchServices csstore scan accepts versioned LaunchServices*.csstore files and verifies candidates with class-2 ContainerManager lookups
          - Apps Manager opens verified virtual class-2 paths directly instead of allowing stock Filza to recalculate an empty jailed documentPath
          - MobileHouseArrest class-2 activation remains the primary app-data route
          - when a selected class-2 root resolves but MHA sandbox-extension activation fails, pinned forcequitOS/bad_query@${BAD_QUERY_COMMIT} is attempted only for that exact selected container root
          - bad_query handles remain active per selected app and the path must pass opendir/readdir before Filza opens it
          - Filza Music Library navigation is intercepted before TGMusicLibraryViewController view loading and routed directly to the complete ByeTunes SwiftUI ContentView
          - TGMusicLibraryViewController viewDidLoad replacement remains a fallback only and does not invoke the legacy Filza implementation
          - ByeTunes embed fallback has a per-controller re-entry guard; host creation/embed failures show a failure view instead of intentionally entering the legacy music path
          - embedded idevice logger registration is non-fatal if a tracing subscriber already exists in the Filza process
          - no separate ByeTunes modal launcher or reduced custom music table in the compiled target
          - complete ByeTunes source pin: NightVibes33/ByeTunes@1a90f9e0f2b1a1787b208809ad2373f5c52175c8
          - 47 original ByeTunes Swift files compiled; only standalone @main shell omitted
          - original downloader, music, ringtones, settings, metadata, lyrics, logs, onboarding, intents and YouTubeKit included
          - original YouTubeKit JavaScript resources and app icon resource bundled in Filza.app
          - original audio document-import types and file-sharing declaration merged into Filza Info.plist
          - full idevice FFI source pin: jkcoxson/idevice@${IDEVICE_COMMIT}
          - final rebuilt IPA SHA-256: ${FILZA_FINAL_SHA}
          - required bundle identifier: com.apple.mobile.MobileHouseArrest
          - preserve that identifier when signing
          EOF

      - name: Upload Dopamine IPA
        uses: actions/upload-artifact@v4
        with:
          name: Dopamine-iOS27-FilzaFork-unsigned-device
          path: ${{ github.workspace }}/Application/Dopamine.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload Dopamine + FilzaSlop research kit
        uses: actions/upload-artifact@v4
        with:
          name: Dopamine-FilzaSlop-fork-iOS27-ResearchKit
          path: ${{ github.workspace }}/ResearchKit
          if-no-files-found: error
          retention-days: 14