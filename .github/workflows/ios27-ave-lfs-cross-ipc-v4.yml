name: iOS27 A18 AVE LFS cross-IPC validation v4

on:
  workflow_dispatch:
  push:
    branches:
      - iphone16-ios27-v2
    paths:
      - '.github/workflows/ios27-ave-lfs-cross-ipc-v4.yml'
      - 'Research/tools/ave_lfs_cross_ipc_map.py'
      - 'Research/tools/ave_lfs_cross_ipc_map_v4.py'
      - 'Research/tools/ave_dimension_flow_map.py'
      - 'Research/tools/ave_lfs_geometry_provenance.py'

permissions:
  contents: read

jobs:
  validate-lfs-cross-ipc-v4:
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      B3_URL: https://updates.cdn-apple.com/2026SpringSeed/fullrestores/140-35950/D135F5B5-C2BE-4630-8AE9-C78A6F0E8381/iPhone17%2C3_27.0_24A5380h_Restore.ipsw
      B4_URL: https://updates.cdn-apple.com/2026SpringSeed/fullrestores/140-57108/5E816D0E-89BB-4B95-8825-6A3EDF22E509/iPhone17%2C3_27.0_24A5390f_Restore.ipsw

    steps:
      - uses: actions/checkout@v4
      - name: Install ipsw
        run: |
          set -euxo pipefail
          brew tap blacktop/tap
          brew trust blacktop/tap
          brew install blacktop/tap/ipsw
      - name: Extract KEXTs and H17 firmware
        run: |
          set -euxo pipefail
          mkdir -p kernels/b3 kernels/b4 report/kexts/b3 report/kexts/b4 fwc/b3 fwc/b4 report/fw/b3 report/fw/b4
          ipsw --no-color extract --remote "$B3_URL" --kernel -o kernels/b3
          ipsw --no-color extract --remote "$B4_URL" --kernel -o kernels/b4
          K3="$(find kernels/b3 -type f -name 'kernelcache.release.*' -print -quit)"
          K4="$(find kernels/b4 -type f -name 'kernelcache.release.*' -print -quit)"
          ipsw --no-color kernel extract "$K3" com.apple.driver.AppleAVE2 --force -o report/kexts/b3
          ipsw --no-color kernel extract "$K4" com.apple.driver.AppleAVE2 --force -o report/kexts/b4
          ipsw --no-color extract --remote "$B3_URL" --pattern 'Firmware/ave/AppleAVE2FW_H17.*\.im4p$' -o fwc/b3
          ipsw --no-color extract --remote "$B4_URL" --pattern 'Firmware/ave/AppleAVE2FW_H17.*\.im4p$' -o fwc/b4
          F3="$(find fwc/b3 -type f -name 'AppleAVE2FW_H17*.im4p' -print -quit)"
          F4="$(find fwc/b4 -type f -name 'AppleAVE2FW_H17*.im4p' -print -quit)"
          ipsw --no-color img4 im4p extract "$F3" --output report/fw/b3/H17.bin
          ipsw --no-color img4 im4p extract "$F4" --output report/fw/b4/H17.bin
      - name: Prove beta3 exact cross-IPC field flow
        run: |
          set -euxo pipefail
          python3 Research/tools/ave_lfs_cross_ipc_map_v4.py report/kexts/b3/com.apple.driver.AppleAVE2 report/kexts/b4/com.apple.driver.AppleAVE2 report/fw/b3/H17.bin report/fw/b4/H17.bin report/cross-ipc-v4.md
          grep -Fq 'beta3 cross-IPC geometry mapping is proven' report/cross-ipc-v4.md
          grep -Fq 'request `+0x374/+0x378`' report/cross-ipc-v4.md
          grep -Fq 'session `+0x16bc/+0x16c0`' report/cross-ipc-v4.md
          grep -Fq 'firmware command `+0x2e2c/+0x2e30`' report/cross-ipc-v4.md
          grep -Fq 'does not prove memory corruption' report/cross-ipc-v4.md
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios27-a18-ave-lfs-cross-ipc-v4
          path: report/cross-ipc-v4.md
          retention-days: 14
