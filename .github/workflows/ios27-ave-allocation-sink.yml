name: iOS27 A18 AVE allocation sink validation

on:
  workflow_dispatch:
  push:
    branches:
      - iphone16-ios27-v2
    paths:
      - '.github/workflows/ios27-ave-allocation-sink.yml'
      - 'Research/tools/ave_dimension_flow_map.py'
      - 'Research/tools/ave_codeddata_sink_map.py'

permissions:
  contents: read

jobs:
  validate-codeddata-allocation-sink:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      B3_URL: https://updates.cdn-apple.com/2026SpringSeed/fullrestores/140-35950/D135F5B5-C2BE-4630-8AE9-C78A6F0E8381/iPhone17%2C3_27.0_24A5380h_Restore.ipsw
      B4_URL: https://updates.cdn-apple.com/2026SpringSeed/fullrestores/140-57108/5E816D0E-89BB-4B95-8825-6A3EDF22E509/iPhone17%2C3_27.0_24A5390f_Restore.ipsw

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ipsw research toolkit
        shell: bash
        run: |
          set -euxo pipefail
          brew tap blacktop/tap
          brew trust blacktop/tap
          brew install blacktop/tap/ipsw
          ipsw version

      - name: Remote-extract beta3 and beta4 kernels
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p firmware/b3 firmware/b4 report/kexts/b3 report/kexts/b4
          ipsw --no-color extract --remote "$B3_URL" --kernel -o firmware/b3
          ipsw --no-color extract --remote "$B4_URL" --kernel -o firmware/b4
          B3_KERNEL="$(find firmware/b3 -type f -name 'kernelcache.release.*' -print -quit)"
          B4_KERNEL="$(find firmware/b4 -type f -name 'kernelcache.release.*' -print -quit)"
          test -s "$B3_KERNEL"
          test -s "$B4_KERNEL"
          printf 'B3_KERNEL=%s\nB4_KERNEL=%s\n' "$B3_KERNEL" "$B4_KERNEL" >> "$GITHUB_ENV"

      - name: Extract AppleAVE2
        shell: bash
        run: |
          set -euxo pipefail
          ipsw --no-color kernel extract "$B3_KERNEL" com.apple.driver.AppleAVE2 --force -o report/kexts/b3
          ipsw --no-color kernel extract "$B4_KERNEL" com.apple.driver.AppleAVE2 --force -o report/kexts/b4
          test -s report/kexts/b3/com.apple.driver.AppleAVE2
          test -s report/kexts/b4/com.apple.driver.AppleAVE2

      - name: Prove dimensions reach coded-data sizing
        shell: bash
        run: |
          set -euxo pipefail
          python3 Research/tools/ave_dimension_flow_map.py \
            report/kexts/b3/com.apple.driver.AppleAVE2 \
            report/kexts/b4/com.apple.driver.AppleAVE2 \
            report/appleave2-dimension-flow.md
          grep -Fq 'request width/height: `+0x374` / `+0x378`' report/appleave2-dimension-flow.md
          grep -Fq 'passed as calculator arguments 3/4' report/appleave2-dimension-flow.md

      - name: Prove CodedData size reaches surface allocation
        shell: bash
        run: |
          set -euxo pipefail
          python3 Research/tools/ave_codeddata_sink_map.py \
            report/kexts/b3/com.apple.driver.AppleAVE2 \
            report/kexts/b4/com.apple.driver.AppleAVE2 \
            report/appleave2-codeddata-sink.md
          grep -Fq 'descriptor `+0x16c`' report/appleave2-codeddata-sink.md
          grep -Fq '`AVE_CreateExternalOutSurfaces`' report/appleave2-codeddata-sink.md
          grep -Fq 'surface create/replacement call' report/appleave2-codeddata-sink.md
          grep -Fq 'static input-to-size-to-allocation chain' report/appleave2-codeddata-sink.md

      - name: Build validation summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# iPhone 16 / A18 iOS 27 beta 3 AppleAVE2 allocation-sink validation'
            echo
            echo 'Static/offline validation only. This does not trigger the vulnerability or claim a jailbreak.'
            echo
            cat report/appleave2-dimension-flow.md
            echo
            cat report/appleave2-codeddata-sink.md
          } > report/summary.md
          cat report/summary.md

      - name: Upload allocation-sink report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios27-a18-ave-allocation-sink
          path: report
          retention-days: 14
