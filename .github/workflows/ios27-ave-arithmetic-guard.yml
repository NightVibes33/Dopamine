name: iOS27 A18 AVE arithmetic guard validation

on:
  workflow_dispatch:
  push:
    branches:
      - iphone16-ios27-v2
    paths:
      - '.github/workflows/ios27-ave-arithmetic-guard.yml'
      - 'Research/tools/ave_arithmetic_guard_map.py'
      - 'Research/tools/test_ave_arithmetic_guard_map.py'

permissions:
  contents: read

jobs:
  validate-codeddata-arithmetic-hardening:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      B3_URL: https://updates.cdn-apple.com/2026SpringSeed/fullrestores/140-35950/D135F5B5-C2BE-4630-8AE9-C78A6F0E8381/iPhone17%2C3_27.0_24A5380h_Restore.ipsw
      B4_URL: https://updates.cdn-apple.com/2026SpringSeed/fullrestores/140-57108/5E816D0E-89BB-4B95-8825-6A3EDF22E509/iPhone17%2C3_27.0_24A5390f_Restore.ipsw

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run arithmetic detector regression tests
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m unittest -v Research/tools/test_ave_arithmetic_guard_map.py

      - name: Install ipsw research toolkit
        shell: bash
        run: |
          set -euxo pipefail
          brew tap blacktop/tap
          brew trust blacktop/tap
          brew install blacktop/tap/ipsw
          ipsw version

      - name: Remote-extract beta3 and beta4 kernels
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p firmware/b3 firmware/b4 report/kexts/b3 report/kexts/b4
          ipsw --no-color extract --remote "$B3_URL" --kernel -o firmware/b3
          ipsw --no-color extract --remote "$B4_URL" --kernel -o firmware/b4
          B3_KERNEL="$(find firmware/b3 -type f -name 'kernelcache.release.*' -print -quit)"
          B4_KERNEL="$(find firmware/b4 -type f -name 'kernelcache.release.*' -print -quit)"
          test -s "$B3_KERNEL"
          test -s "$B4_KERNEL"
          printf 'B3_KERNEL=%s\nB4_KERNEL=%s\n' "$B3_KERNEL" "$B4_KERNEL" >> "$GITHUB_ENV"

      - name: Extract AppleAVE2
        shell: bash
        run: |
          set -euxo pipefail
          ipsw --no-color kernel extract "$B3_KERNEL" com.apple.driver.AppleAVE2 --force -o report/kexts/b3
          ipsw --no-color kernel extract "$B4_KERNEL" com.apple.driver.AppleAVE2 --force -o report/kexts/b4
          test -s report/kexts/b3/com.apple.driver.AppleAVE2
          test -s report/kexts/b4/com.apple.driver.AppleAVE2

      - name: Prove coded-data arithmetic hardening delta
        shell: bash
        run: |
          set -euxo pipefail
          python3 Research/tools/ave_arithmetic_guard_map.py \
            report/kexts/b3/com.apple.driver.AppleAVE2 \
            report/kexts/b4/com.apple.driver.AppleAVE2 \
            report/appleave2-arithmetic-hardening.md
          grep -Fq 'beta3 reaches a 32-bit multiply' report/appleave2-arithmetic-hardening.md
          grep -Fq 'beta4 adds a signed 64-bit width×height multiply' report/appleave2-arithmetic-hardening.md
          grep -Fq 'branches on that derived range value' report/appleave2-arithmetic-hardening.md
          grep -Fq 'register-linked SMULL → LSR #31 → CBNZ data flow' report/appleave2-arithmetic-hardening.md
          grep -Fq 'does not derive a triggering width/height pair' report/appleave2-arithmetic-hardening.md

      - name: Upload arithmetic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios27-a18-ave-arithmetic-hardening
          path: report
          retention-days: 14
