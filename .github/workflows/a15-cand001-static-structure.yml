name: A15 CAND-001 Static Structure

on:
  workflow_dispatch:
  push:
    branches:
      - research/a15-legacy-restore-lab
    paths:
      - 'research/a15-legacy-restore/cand001-static-structure.py'
      - 'research/a15-legacy-restore/function-fingerprint-diff.py'
      - 'research/a15-legacy-restore/function-feature-triage.py'
      - 'research/a15-legacy-restore/rom-sources.json'
      - '.github/workflows/a15-cand001-static-structure.yml'
  pull_request:
    branches:
      - 2.x
    paths:
      - 'research/a15-legacy-restore/cand001-static-structure.py'
      - 'research/a15-legacy-restore/function-fingerprint-diff.py'
      - 'research/a15-legacy-restore/function-feature-triage.py'
      - 'research/a15-legacy-restore/rom-sources.json'
      - '.github/workflows/a15-cand001-static-structure.yml'

permissions:
  contents: read

jobs:
  characterize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned analysis dependency
        run: python3 -m pip install --disable-pip-version-check 'capstone>=5,<6'

      - name: Syntax check
        run: python3 -m py_compile research/a15-legacy-restore/cand001-static-structure.py

      - name: Fetch and verify pinned public T8110 revisions
        run: |
          mkdir -p research/a15-legacy-restore/data/t8110-structure
          python3 - <<'PY'
          import json, pathlib, subprocess, urllib.parse, urllib.request
          cfg=json.load(open('research/a15-legacy-restore/rom-sources.json'))
          root=pathlib.Path('research/a15-legacy-restore/data/t8110-structure')
          base=f"https://raw.githubusercontent.com/{cfg['source_repository']}/{cfg['source_commit']}/"
          for entry in cfg['roms']:
              url=base+urllib.parse.quote(entry['path'], safe='/')
              out=root/(entry['label']+'.bin')
              with urllib.request.urlopen(url, timeout=60) as r:
                  out.write_bytes(r.read())
              blob=subprocess.check_output(['git','hash-object',str(out)], text=True).strip()
              if blob != entry['git_blob_sha']:
                  raise SystemExit(f"Git blob mismatch for {entry['label']}")
              print(f"verified {entry['label']} {blob}")
          PY

      - name: Reconstruct changed-function candidate set
        run: |
          python3 research/a15-legacy-restore/function-fingerprint-diff.py \
            research/a15-legacy-restore/data/t8110-structure/A15-A0.bin \
            research/a15-legacy-restore/data/t8110-structure/A15-B0-B1.bin \
            --output research/a15-legacy-restore/data/t8110-structure/function-fingerprint.json
          python3 research/a15-legacy-restore/function-feature-triage.py \
            research/a15-legacy-restore/data/t8110-structure/A15-A0.bin \
            research/a15-legacy-restore/data/t8110-structure/A15-B0-B1.bin \
            research/a15-legacy-restore/data/t8110-structure/function-fingerprint.json \
            --output research/a15-legacy-restore/data/t8110-structure/function-feature-triage.json

      - name: Characterize CAND-001 aggregate CFG and data flow
        run: |
          python3 research/a15-legacy-restore/cand001-static-structure.py \
            research/a15-legacy-restore/data/t8110-structure/A15-A0.bin \
            research/a15-legacy-restore/data/t8110-structure/A15-B0-B1.bin \
            research/a15-legacy-restore/data/t8110-structure/function-feature-triage.json \
            --candidate CAND-001 \
            --output research/a15-legacy-restore/data/t8110-structure/cand001-static-structure.json

      - name: Verify report is redacted and non-operational
        run: |
          python3 - <<'PY'
          import json
          p='research/a15-legacy-restore/data/t8110-structure/cand001-static-structure.json'
          x=json.load(open(p))
          assert x['candidate_id']=='CAND-001'
          assert x['interpretation']['vulnerability_status']=='NOT_ESTABLISHED'
          assert 'A15_A0' in x and 'A15_B0_B1' in x
          assert 'a_start' not in str(x) and 'b_start' not in str(x)
          print('redacted aggregate report verified')
          PY

      - name: Remove ROM binaries
        run: rm -f research/a15-legacy-restore/data/t8110-structure/*.bin

      - name: Upload aggregate static-structure report
        uses: actions/upload-artifact@v4
        with:
          name: a15-cand001-static-structure
          path: research/a15-legacy-restore/data/t8110-structure/cand001-static-structure.json
