name: Prepare final FilzaSlop repin

on:
  push:
    branches:
      - iphone16-ios27-v2
    paths:
      - .github/workflows/repin-filza-final-once.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: iphone16-ios27-v2
          fetch-depth: 0

      - name: Create unattached workflow blob
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/main.yml')
          s = p.read_text()
          replacements = {
              'FilzaSlop-v1.0.1-unsigned.ipa': 'FilzaSlop-v1.0.2-unsigned.ipa',
              '36a13f2b6d77a86cc32d7744555a176a2092e933d3746e999110f1717d36a6ba': 'b11ce30a2db6f6bc77773ed30bdb855d7c847830891b14d21230f2d893d5f223',
              'e003412e404aa48e39011317f60cade8bb2b3620': '6085955807f01ccbe8cf38abe157f3c93421d7cd',
              'FilzaSlop-full-ByeTunes-badquery-iOS27-e003412.ipa': 'FilzaSlop-full-ByeTunes-badquery-iOS27-6085955.ipa',
              'v1.0.1': 'v1.0.2',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected main workflow anchor: {old}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
          grep -Fq 'FILZA_UPSTREAM_NAME: FilzaSlop-v1.0.2-unsigned.ipa' .github/workflows/main.yml
          grep -Fq 'FILZA_UPSTREAM_SHA256: b11ce30a2db6f6bc77773ed30bdb855d7c847830891b14d21230f2d893d5f223' .github/workflows/main.yml
          grep -Fq 'FILZA_FORK_COMMIT: 6085955807f01ccbe8cf38abe157f3c93421d7cd' .github/workflows/main.yml
          grep -Fq 'FILZA_FORK_IPA: FilzaSlop-full-ByeTunes-badquery-iOS27-6085955.ipa' .github/workflows/main.yml
          ! grep -Fq 'v1.0.1' .github/workflows/main.yml

          python3 - <<'PY' > /tmp/blob.json
          import base64, json
          raw = open('.github/workflows/main.yml','rb').read()
          print(json.dumps({'content': base64.b64encode(raw).decode(), 'encoding': 'base64'}))
          PY
          RESPONSE="$(curl -fsSL -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @/tmp/blob.json \
            'https://api.github.com/repos/NightVibes33/Dopamine/git/blobs')"
          BLOB_SHA="$(python3 -c 'import json,sys; print(json.loads(sys.stdin.read())["sha"])' <<<"$RESPONSE")"
          test -n "$BLOB_SHA"
          echo "PREPARED_MAIN_WORKFLOW_BLOB_SHA=$BLOB_SHA"
          git diff -- .github/workflows/main.yml
