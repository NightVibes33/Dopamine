name: Temporary Filza pin blob helper

on:
  push:
    branches:
      - iphone16-ios27-v2
    paths:
      - .github/workflows/repin-filza-temp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  make-blob:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: iphone16-ios27-v2
      - name: Create updated main.yml blob without updating workflow ref
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/main.yml')
          s = p.read_text()
          old_commit = 'FILZA_FORK_COMMIT: b69a8b6d1e2cfb4912d8760d260ce8a23c4b6c26'
          new_commit = 'FILZA_FORK_COMMIT: be2f852ce5d368e126a2805b6132a6d9c4750d75'
          old_ipa = 'FILZA_FORK_IPA: FilzaSlop-full-ByeTunes-badquery-iOS27-b69a8b6.ipa'
          new_ipa = 'FILZA_FORK_IPA: FilzaSlop-full-ByeTunes-systemprobe-iOS27-be2f852.ipa'
          if s.count(old_commit) != 1 or s.count(old_ipa) != 1:
              raise SystemExit('expected old Filza pin not found exactly once')
          s = s.replace(old_commit, new_commit).replace(old_ipa, new_ipa)
          p.write_text(s)
          PY
          CONTENT="$(base64 -w0 .github/workflows/main.yml)"
          RESPONSE="$(curl -fsSL -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPO/git/blobs" \
            -d "{\"content\":\"$CONTENT\",\"encoding\":\"base64\"}")"
          SHA="$(printf '%s' "$RESPONSE" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          echo "UPDATED_MAIN_BLOB_SHA=$SHA"
          echo "$SHA" > updated-main-blob-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: updated-main-blob-sha
          path: updated-main-blob-sha.txt
