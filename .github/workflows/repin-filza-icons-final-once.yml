name: Prepare final FilzaSlop icon repin

on:
  push:
    branches:
      - iphone16-ios27-v2
    paths:
      - .github/workflows/repin-filza-icons-final-once.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: iphone16-ios27-v2
          fetch-depth: 0

      - name: Create unattached workflow blob
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/main.yml')
          s = p.read_text()
          old_commit = '6085955807f01ccbe8cf38abe157f3c93421d7cd'
          new_commit = 'b69a8b6d1e2cfb4912d8760d260ce8a23c4b6c26'
          old_ipa = 'FilzaSlop-full-ByeTunes-badquery-iOS27-6085955.ipa'
          new_ipa = 'FilzaSlop-full-ByeTunes-badquery-iOS27-b69a8b6.ipa'
          for old, new in [(old_commit, new_commit), (old_ipa, new_ipa)]:
              if old not in s:
                  raise SystemExit(f'missing expected workflow anchor: {old}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
          grep -Fq 'FILZA_FORK_COMMIT: b69a8b6d1e2cfb4912d8760d260ce8a23c4b6c26' .github/workflows/main.yml
          grep -Fq 'FILZA_FORK_IPA: FilzaSlop-full-ByeTunes-badquery-iOS27-b69a8b6.ipa' .github/workflows/main.yml

          python3 - <<'PY' > /tmp/blob.json
          import base64, json
          raw = open('.github/workflows/main.yml','rb').read()
          print(json.dumps({'content': base64.b64encode(raw).decode(), 'encoding': 'base64'}))
          PY
          RESPONSE="$(curl -fsSL -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @/tmp/blob.json \
            'https://api.github.com/repos/NightVibes33/Dopamine/git/blobs')"
          BLOB_SHA="$(python3 -c 'import json,sys; print(json.loads(sys.stdin.read())["sha"])' <<<"$RESPONSE")"
          test -n "$BLOB_SHA"
          echo "PREPARED_MAIN_WORKFLOW_BLOB_SHA=$BLOB_SHA"
          git diff -- .github/workflows/main.yml
