name: iOS27 A18 AVE LRB identity probe

on:
  workflow_dispatch:
  push:
    branches:
      - iphone16-ios27-v2
    paths:
      - '.github/workflows/ios27-ave-lrb-identity.yml'
      - 'Research/tools/ave_lrb_identity_probe.py'

permissions:
  contents: read

jobs:
  probe-lrb-identity:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      B3_URL: https://updates.cdn-apple.com/2026SpringSeed/fullrestores/140-35950/D135F5B5-C2BE-4630-8AE9-C78A6F0E8381/iPhone17%2C3_27.0_24A5380h_Restore.ipsw

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ipsw research toolkit
        shell: bash
        run: |
          set -euxo pipefail
          brew tap blacktop/tap
          brew trust blacktop/tap
          brew install blacktop/tap/ipsw

      - name: Extract beta3 AppleAVE2
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p firmware report/kexts
          ipsw --no-color extract --remote "$B3_URL" --kernel -o firmware
          B3_KERNEL="$(find firmware -type f -name 'kernelcache.release.*' -print -quit)"
          test -s "$B3_KERNEL"
          ipsw --no-color kernel extract "$B3_KERNEL" com.apple.driver.AppleAVE2 --force -o report/kexts
          test -s report/kexts/com.apple.driver.AppleAVE2

      - name: Inventory LRB identity anchors
        shell: bash
        run: |
          set -euxo pipefail
          python3 Research/tools/ave_lrb_identity_probe.py \
            report/kexts/com.apple.driver.AppleAVE2 \
            report/appleave2-lrb-identity-probe.md
          grep -Fq 'allocation anchor' report/appleave2-lrb-identity-probe.md
          grep -Fq 'Exact +0x31c accesses' report/appleave2-lrb-identity-probe.md
          grep -Fq 'Calls to actual-size export helper' report/appleave2-lrb-identity-probe.md

      - name: Upload LRB identity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios27-a18-ave-lrb-identity-probe
          path: report/appleave2-lrb-identity-probe.md
          retention-days: 14
