name: iOS27 A18 AVE LFSOutput DMA validation

on:
  workflow_dispatch:
  push:
    branches:
      - iphone16-ios27-v2
    paths:
      - '.github/workflows/ios27-ave-lfsoutput-dma.yml'
      - 'Research/tools/ave_lfsoutput_dma_candidate.py'

permissions:
  contents: read

jobs:
  validate-lfsoutput-dma-path:
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      B3_URL: https://updates.cdn-apple.com/2026SpringSeed/fullrestores/140-35950/D135F5B5-C2BE-4630-8AE9-C78A6F0E8381/iPhone17%2C3_27.0_24A5380h_Restore.ipsw
      B4_URL: https://updates.cdn-apple.com/2026SpringSeed/fullrestores/140-57108/5E816D0E-89BB-4B95-8825-6A3EDF22E509/iPhone17%2C3_27.0_24A5390f_Restore.ipsw

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ipsw research toolkit
        shell: bash
        run: |
          set -euxo pipefail
          brew tap blacktop/tap
          brew trust blacktop/tap
          brew install blacktop/tap/ipsw

      - name: Remote-extract beta3 and beta4 kernels
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p firmware/b3 firmware/b4 report/kexts/b3 report/kexts/b4 report/fw/b3 report/fw/b4
          ipsw --no-color extract --remote "$B3_URL" --kernel -o firmware/b3
          ipsw --no-color extract --remote "$B4_URL" --kernel -o firmware/b4
          B3_KERNEL="$(find firmware/b3 -type f -name 'kernelcache.release.*' -print -quit)"
          B4_KERNEL="$(find firmware/b4 -type f -name 'kernelcache.release.*' -print -quit)"
          test -s "$B3_KERNEL"
          test -s "$B4_KERNEL"
          printf 'B3_KERNEL=%s\nB4_KERNEL=%s\n' "$B3_KERNEL" "$B4_KERNEL" >> "$GITHUB_ENV"
          ipsw --no-color kernel extract "$B3_KERNEL" com.apple.driver.AppleAVE2 --force -o report/kexts/b3
          ipsw --no-color kernel extract "$B4_KERNEL" com.apple.driver.AppleAVE2 --force -o report/kexts/b4
          test -s report/kexts/b3/com.apple.driver.AppleAVE2
          test -s report/kexts/b4/com.apple.driver.AppleAVE2

      - name: Remote-extract and unpack H17 AVE firmware
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p fw-container/b3 fw-container/b4
          ipsw --no-color extract --remote "$B3_URL" --pattern 'Firmware/ave/AppleAVE2FW_H17.*\.im4p$' -o fw-container/b3
          ipsw --no-color extract --remote "$B4_URL" --pattern 'Firmware/ave/AppleAVE2FW_H17.*\.im4p$' -o fw-container/b4
          B3_FW_IM4P="$(find fw-container/b3 -type f -name 'AppleAVE2FW_H17*.im4p' -print -quit)"
          B4_FW_IM4P="$(find fw-container/b4 -type f -name 'AppleAVE2FW_H17*.im4p' -print -quit)"
          test -s "$B3_FW_IM4P"
          test -s "$B4_FW_IM4P"
          ipsw --no-color img4 im4p extract "$B3_FW_IM4P" --output report/fw/b3/AppleAVE2FW_H17.bin
          ipsw --no-color img4 im4p extract "$B4_FW_IM4P" --output report/fw/b4/AppleAVE2FW_H17.bin
          test -s report/fw/b3/AppleAVE2FW_H17.bin
          test -s report/fw/b4/AppleAVE2FW_H17.bin

      - name: Prove LFSOutput host allocation to write-DMA path
        shell: bash
        run: |
          set -euxo pipefail
          python3 Research/tools/ave_lfsoutput_dma_candidate.py \
            report/kexts/b3/com.apple.driver.AppleAVE2 \
            report/kexts/b4/com.apple.driver.AppleAVE2 \
            report/fw/b3/AppleAVE2FW_H17.bin \
            report/fw/b4/AppleAVE2FW_H17.bin \
            report/appleave2-lfsoutput-dma.md
          grep -Fq 'buffer-size descriptor `+0x37c`' report/appleave2-lfsoutput-dma.md
          grep -Fq 'beta3 LFS pInfo descriptor offset: `+0x51b0`' report/appleave2-lfsoutput-dma.md
          grep -Fq 'beta4 LFS pInfo descriptor offset: `+0x51c8`' report/appleave2-lfsoutput-dma.md
          grep -Fq 'neither firmware routine loads the adjacent serialized backing-size field' report/appleave2-lfsoutput-dma.md
          grep -Fq 'independently derives its DMA extent from geometry' report/appleave2-lfsoutput-dma.md
          grep -Fq 'not proof of memory corruption' report/appleave2-lfsoutput-dma.md

      - name: Upload LFSOutput validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios27-a18-ave-lfsoutput-dma
          path: report/appleave2-lfsoutput-dma.md
          retention-days: 14
