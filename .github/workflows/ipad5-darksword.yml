name: "Dopamine: iPad 5 DarkSword control matrix"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ipad5-darksword.yml"
      - "research/ipad5_darksword_patch.py"
      - "Application/**"
      - "BaseBin/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ipad5-darksword.yml"
      - "research/ipad5_darksword_patch.py"
      - "Application/**"
      - "BaseBin/**"

concurrency:
  group: ipad5-darksword-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.profile }} control
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        profile:
          - stock
          - stability

    steps:
      - name: Checkout main with submodules
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0

      - name: Select build profile
        shell: bash
        run: |
          set -euo pipefail
          echo "DARKSWORD_PROFILE=${{ matrix.profile }}" >> "$GITHUB_ENV"
          mkdir -p output

          if [ "${{ matrix.profile }}" = "stability" ]; then
            python3 research/ipad5_darksword_patch.py
            grep -nE 'stability profile|watchdog-safe DarkSword parameters|surface_munlock\(searchMappingAddress, searchMappingSize\)|bounded corruption attempt exhausted' \
              Application/Dopamine/Exploits/DarkSword/DarkSword.m
          else
            if grep -q 'isIPad5Device' Application/Dopamine/Exploits/DarkSword/DarkSword.m; then
              echo '::error::Stock control unexpectedly contains the iPad-specific runtime patch'
              exit 1
            fi
            grep -n 'totalSearchMappingPagesNum = isA18Device ? (0x10 \* 0x10) : (0x1000 \* 0x10)' \
              Application/Dopamine/Exploits/DarkSword/DarkSword.m
          fi

          git diff --check
          git diff -- Application/Dopamine/Exploits/DarkSword/DarkSword.m \
            Application/Dopamine/Jailbreak/DOJailbreaker.m > "output/${{ matrix.profile }}-source.patch"

      - name: Xcode setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Procursus
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install make libarchive openssl
          echo "PATH=$(brew --prefix make)/libexec/gnubin:$PATH" >> "$GITHUB_ENV"

      - name: Install Theos and iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          export BASEDIR="$PWD"
          export THEOS="$BASEDIR/theos"
          mkdir -p "$THEOS"
          curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos > install-theos.sh
          gsed -E "/^\s*get_theos\s*$/,+1 s/^(\s*)(get_sdks)\s*$/\1mkdir -p \${THEOS}\/sdks\n\1touch \${THEOS}\/sdks\/sdk\n\1\2/g" -i install-theos.sh
          bash install-theos.sh
          curl -fL https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz \
            -o "$THEOS/sdks/iPhoneOS16.5.sdk.tar.xz"
          tar -xf "$THEOS/sdks/iPhoneOS16.5.sdk.tar.xz" -C "$THEOS/sdks"
          rm "$THEOS/sdks/iPhoneOS16.5.sdk.tar.xz"

      - name: Build and install trustcache
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/CRKatri/trustcache
          cd trustcache
          export CFLAGS="${CFLAGS:-} -I$(brew --prefix openssl)/include -arch arm64"
          export LDFLAGS="${LDFLAGS:-} -L$(brew --prefix openssl)/lib -arch arm64"
          gmake -j"$(sysctl -n hw.logicalcpu)" OPENSSL=1
          sudo cp trustcache /opt/procursus/bin/

      - name: Download bootstraps
        shell: bash
        run: |
          set -euo pipefail
          cd Application/Dopamine/Resources
          ./download_bootstraps.sh

      - name: Build IPA
        shell: bash
        run: |
          set -euo pipefail
          export BASEDIR="$PWD"
          export THEOS="$BASEDIR/theos"
          gmake -j"$(sysctl -n hw.logicalcpu)" NIGHTLY=1
          test -s Application/Dopamine.ipa

      - name: Package diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cp Application/Dopamine.ipa "output/Dopamine-iPad5-DarkSword-${{ matrix.profile }}.ipa"
          shasum -a 256 "output/Dopamine-iPad5-DarkSword-${{ matrix.profile }}.ipa" \
            > "output/Dopamine-iPad5-DarkSword-${{ matrix.profile }}.ipa.sha256"

          {
            echo "profile=${{ matrix.profile }}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "source_sha=$(git rev-parse HEAD)"
            echo "source_short_sha=$(git rev-parse --short HEAD)"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "workflow_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "built_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "xcode=$(xcodebuild -version | tr '\n' ' ')"
            echo "submodules:"
            git submodule status --recursive
          } > "output/${{ matrix.profile }}-manifest.txt"

          find . -type d -name '*.dSYM' -prune -print > "output/${{ matrix.profile }}-dsym-paths.txt"
          if [ -s "output/${{ matrix.profile }}-dsym-paths.txt" ]; then
            tar -czf "output/${{ matrix.profile }}-dSYMs.tar.gz" \
              -T "output/${{ matrix.profile }}-dsym-paths.txt"
          fi

      - name: Upload ${{ matrix.profile }} package
        uses: actions/upload-artifact@v4
        with:
          name: Dopamine-iPad5-DarkSword-${{ matrix.profile }}
          path: output/
          if-no-files-found: error
          retention-days: 14
