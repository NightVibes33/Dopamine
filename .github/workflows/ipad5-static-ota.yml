name: iPad 5 signed OTA installer

on:
  workflow_dispatch:
  push:
    branches:
      - ipad5-16.7.11-v2
    paths:
      - ".github/workflows/ipad5-static-ota.yml"

permissions:
  actions: read
  contents: read

concurrency:
  group: dopamine-ipad5-static-ota
  cancel-in-progress: true

jobs:
  sign-and-serve:
    runs-on: macos-latest
    timeout-minutes: 270
    steps:
      - name: Checkout Dopamine branch
        uses: actions/checkout@v4

      - name: Download exact successful run 28 IPA
        uses: actions/download-artifact@v4
        with:
          name: Dopamine
          path: unsigned
          repository: NightVibes33/Dopamine
          run-id: 31246332731
          github-token: ${{ github.token }}

      - name: Fetch signing assets
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/NightVibes33/app-code-certificates.git signer

      - name: Sign exact run 28 IPA with persisted iPad profile
        shell: bash
        env:
          P12_PASSWORD: "1"
        run: |
          set -euxo pipefail
          mkdir -p work output
          UNSIGNED_IPA="$(find unsigned -type f -name '*.ipa' -print -quit)"
          test -s "$UNSIGNED_IPA"

          python3 - <<'PY'
          import base64
          from pathlib import Path

          def clean(value: str) -> str:
              value = ''.join(value.split())
              return value + '=' * (-len(value) % 4)

          Path('work/development.p12').write_bytes(
              base64.b64decode(clean(Path('signer/dopamine/Dopamine-Development.p12.b64').read_text()), validate=True)
          )
          parts = sorted(Path('signer/dopamine/profile.parts').glob('*'))
          raw = ''.join(''.join(p.read_text().split()) for p in parts) if parts else Path('signer/dopamine/Dopamine-iPad5.mobileprovision.b64').read_text()
          Path('work/profile.mobileprovision').write_bytes(base64.b64decode(clean(raw), validate=True))
          PY

          security cms -D -i work/profile.mobileprovision > work/profile.plist
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          p = plistlib.loads(Path('work/profile.plist').read_bytes())
          e = p['Entitlements']
          bid = e['application-identifier'].split('.', 1)[1]
          Path('work/bundle-id.txt').write_text(bid)
          Path('work/entitlements.plist').write_bytes(plistlib.dumps(e, fmt=plistlib.FMT_XML, sort_keys=False))
          Path('work/device-count.txt').write_text(str(len(p.get('ProvisionedDevices', []))))
          PY
          echo "Persisted profile device count: $(cat work/device-count.txt)"

          KEYCHAIN="$RUNNER_TEMP/dopamine-ipad5-static.keychain-db"
          KEYCHAIN_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 18000 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import work/development.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/^[[:space:]]*[0-9]+\)/ {print $2; exit}')"
          test -n "$IDENTITY"

          mkdir -p work/unpacked
          unzip -q "$UNSIGNED_IPA" -d work/unpacked
          APP="$(find work/unpacked/Payload -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -d "$APP"
          BUNDLE_ID="$(cat work/bundle-id.txt)"
          BUILD_NUMBER="$(date -u +%Y%m%d%H%M%S)"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$APP/Info.plist"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")"
          cp work/profile.mobileprovision "$APP/embedded.mobileprovision"
          find "$APP" -type d -name _CodeSignature -prune -exec rm -rf '{}' +

          if [[ -d "$APP/Frameworks" ]]; then
            while IFS= read -r -d '' framework; do
              codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN" --timestamp=none "$framework"
            done < <(find "$APP/Frameworks" -depth -type d -name '*.framework' -print0)
          fi
          while IFS= read -r -d '' dylib; do
            codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN" --timestamp=none "$dylib"
          done < <(find "$APP" -type f -name '*.dylib' -print0)
          while IFS= read -r -d '' extension; do
            codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN" --timestamp=none "$extension"
          done < <(find "$APP" -depth -type d -name '*.appex' -print0)

          codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN" --timestamp=none --entitlements work/entitlements.plist --generate-entitlement-der "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          (cd work/unpacked && zip -qry "$GITHUB_WORKSPACE/output/Dopamine-iPad5-run28-signed.ipa" Payload)
          test -s output/Dopamine-iPad5-run28-signed.ipa

          python3 - <<PY
          import json
          from pathlib import Path
          Path('output/metadata.json').write_text(json.dumps({
            'bundle_id': '$BUNDLE_ID',
            'version': '$VERSION',
            'build': '$BUILD_NUMBER',
            'title': 'Dopamine iPad 5',
            'source_sha': 'fa0776152e9352782c80bf9ee2f7e11809a759db'
          }, indent=2) + '\n')
          PY
          security delete-keychain "$KEYCHAIN"

      - name: Start temporary HTTPS OTA site
        id: ota
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p site/latest
          cp output/Dopamine-iPad5-run28-signed.ipa site/latest/Dopamine-iPad5-latest-signed.ipa

          RUNNER_TRACKING_ID="" nohup python3 -m http.server 8080 --bind 127.0.0.1 --directory site > http.log 2>&1 &
          echo "$!" > server.pid

          ARCH="$(uname -m)"
          if [[ "$ARCH" == "arm64" ]]; then CF_ARCH=arm64; else CF_ARCH=amd64; fi
          curl -fsSL "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-${CF_ARCH}.tgz" -o cloudflared.tgz
          tar -xzf cloudflared.tgz
          chmod +x cloudflared
          RUNNER_TRACKING_ID="" nohup ./cloudflared tunnel --url http://127.0.0.1:8080 --no-autoupdate > cloudflared.log 2>&1 &
          echo "$!" > tunnel.pid

          URL=""
          for _ in $(seq 1 90); do
            URL="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' cloudflared.log | head -n1 || true)"
            [[ -n "$URL" ]] && break
            sleep 2
          done
          test -n "$URL"

          python3 - <<PY
          import html, json, plistlib
          from pathlib import Path
          from urllib.parse import quote

          base = '${URL}'
          meta = json.loads(Path('output/metadata.json').read_text())
          ipa_url = base + '/latest/Dopamine-iPad5-latest-signed.ipa'
          manifest_url = base + '/latest/manifest.plist'
          manifest = {
            'items': [{
              'assets': [{'kind': 'software-package', 'url': ipa_url}],
              'metadata': {
                'bundle-identifier': meta['bundle_id'],
                'bundle-version': meta['version'],
                'kind': 'software',
                'title': meta['title'],
              }
            }]
          }
          Path('site/latest/manifest.plist').write_bytes(plistlib.dumps(manifest, fmt=plistlib.FMT_XML, sort_keys=False))
          install = 'itms-services://?action=download-manifest&url=' + quote(manifest_url, safe='')
          page = f'''<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Dopamine iPad 5</title><style>body{{margin:0;min-height:100vh;display:grid;place-items:center;background:#080a10;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:24px}}main{{max-width:520px;width:100%;background:#111521;border:1px solid #252b3a;border-radius:28px;padding:28px;box-sizing:border-box}}h1{{font-size:42px;margin:0 0 12px}}p{{color:#aeb6c8;line-height:1.5}}a{{display:block;margin-top:24px;padding:18px;border-radius:16px;background:#82f5b1;color:#071109;text-align:center;text-decoration:none;font-size:18px;font-weight:800}}</style></head><body><main><h1>Dopamine</h1><p>Signed iPad 5 build from successful run #28, source {meta['source_sha'][:10]}.</p><a href="{html.escape(install, quote=True)}">Install Dopamine</a></main></body></html>'''
          Path('site/index.html').write_text(page)
          Path('ota-url.txt').write_text(base + '/\n')
          Path('ipa-url.txt').write_text(ipa_url + '\n')
          PY

          curl -fsS --retry 20 --retry-all-errors --retry-delay 2 "$URL/" >/dev/null
          curl -fsS --retry 20 --retry-all-errors --retry-delay 2 "$URL/latest/manifest.plist" >/dev/null
          echo "installer_url=$URL/" >> "$GITHUB_OUTPUT"
          echo "::notice title=Dopamine iPad 5 OTA::$URL/"

      - name: Upload signed IPA and OTA links
        uses: actions/upload-artifact@v4
        with:
          name: Dopamine-iPad5-signed-OTA
          path: |
            output/Dopamine-iPad5-run28-signed.ipa
            output/metadata.json
            ota-url.txt
            ipa-url.txt
          retention-days: 7
          if-no-files-found: error

      - name: Keep OTA site online
        shell: bash
        run: |
          set -euo pipefail
          SERVER_PID="$(cat server.pid)"
          TUNNEL_PID="$(cat tunnel.pid)"
          for _ in $(seq 1 530); do
            kill -0 "$SERVER_PID" 2>/dev/null || exit 1
            kill -0 "$TUNNEL_PID" 2>/dev/null || exit 1
            sleep 30
          done
